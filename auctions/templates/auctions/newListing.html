{% extends "auctions/layout.html" %}
{% load static %}

{% block head %}
    <link href="{% static 'auctions/newListing.css' %}" rel="stylesheet">
{% endblock %}

{% block body %}
    <h2>Create a New Listing</h2>

    <form action="{% url 'creatNewListing' %}" method="POST">
        {% csrf_token %}
        
        {% if errorMessage %}
            <div class="error-message">{{ errorMessage }}!</div>
        {% endif %}
        
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" placeholder="Enter title of your Listing">
        
        <label for="description">Description:</label>
        <textarea id="description" rows="4" name="description" placeholder="Enter description of your Listing"></textarea>
        
        <label for="bid">Starting bid:</label>
        <input type="number" id="bid" name="bid" min="0" step="0.01" placeholder="Enter bid of your Listing">
        
        <label for="imageURL">Image URL:</label>
        <input type="url" id="imageURL" name="imageURL" placeholder="Enter an image URL for your Listing">
        
        <label for="category">Category:</label>
        <select id="category" name="category">
            {% for category in categories %}    
                <option value="{{ category }}">{{ category}}</option>
            {% endfor %}
        </select>

        {% comment %} <input type="datetime-local" name="datetime" hidden> {% endcomment %}
        <button type="submit">Create Listing</button>
    </form>
{% endblock %}
